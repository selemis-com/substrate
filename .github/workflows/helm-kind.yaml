name: Helm Kind
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gvisor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Setup Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.20.0
    - name: Install twice and restore a gVisor Actor
      env:
        ATE_HELM_CHART_ARCHIVE: ${{ runner.temp }}/substrate-kind-charts.zip
      run: .github/scripts/helm-kind/smoke.sh v1.0.0-rc.3
    - name: Upload tested Helm charts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ runner.temp }}/substrate-kind-charts.zip
        archive: false
        if-no-files-found: error
